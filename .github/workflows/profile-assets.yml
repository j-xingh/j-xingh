name: Profile assets
on:
  schedule: [{ cron: "0 */12 * * *" }]
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/profile-assets.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build stats cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python scripts/stats.py assets
      - name: Commit stats cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --staged --quiet || (git commit -m "chore: refresh activity stats" && git push)
      - name: Build contribution snake (acid lime)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=#C6FF00&color_dots=#161A12,#39451A,#596B1D,#8FB300,#C6FF00
            dist/snake-light.svg?color_snake=#566D00&color_dots=#E3E8D6,#D3E58A,#B8D84A,#91BD00,#566D00
      - name: Publish snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
